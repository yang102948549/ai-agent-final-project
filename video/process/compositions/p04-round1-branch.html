    const typedEl = document.getElementById("p04-typed");
    const t1 = "선택에 따른 다른 장면들이 각각 등장하도록 시나리오를 세분화하자.";
    const t2 = "마지막 장면이 대표 발언으로 반복되지 않게 자연스럽게 바꿔줘.";
    function syncTyping() {
      const t = tl.time();
      if (t >= 0.6 && t < 2.95) {
        const p = Math.max(0, Math.min(1, (t - 0.6) / 2.0));
        typedEl.textContent = t1.slice(0, Math.round(p * t1.length));
      } else if (t >= 7.4 && t < 9.75) {
        const p = Math.max(0, Math.min(1, (t - 7.4) / 2.0));
        typedEl.textContent = t2.slice(0, Math.round(p * t2.length));
      } else {
        typedEl.textContent = "";
      }
    }
    const tl = gsap.timeline({ paused: true, onUpdate: syncTyping });

    // 진행 막대 (Round 1 구간: 26% -> 36%)
    tl.fromTo("#p04-prog", { scaleX: 0.26 }, { scaleX: 0.36, duration: 16, ease: "none" }, 0);

    // 0.25~0.6s: 프롬프트 입력창 부드럽게 등장

    // 커서 결정론 깜빡임
    tl.to("#p04-cursor", { opacity: 0, duration: 0.35, repeat: 42, yoyo: true, ease: "steps(1)" }, 0.3);

    // 2.65~3.0s: 전송 버튼 점등 및 클릭 + 사용자 말풍선 등록

    tl.to("#p04-send", { scale: 1, backgroundColor: "#e5e2da", duration: 0.18, ease: "power2.out" }, 2.82);
    tl.fromTo("#p04-u1", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.28, ease: "power2.out" }, 2.95);

    // 3.25~3.85s: 에이전트 생각 중
    tl.fromTo("#p04-think", { opacity: 0 }, { opacity: 1, duration: 0.18 }, 3.25);
    tl.to("#p04-think", { opacity: 0, duration: 0.15 }, 3.85);

    // 3.95s: 1차 에이전트 응답 등장

    // 4.35~5.55s: 오른쪽 BEFORE -> AFTER 와이프 슬라이더 비교

    tl.fromTo("#p04-after-layer", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 1.15, ease: "power2.inOut" }, 4.38);
    tl.fromTo("#p04-wipe-line", { x: 0 }, { x: 1104, duration: 1.15, ease: "power2.inOut" }, 4.38);
    tl.to("#p04-wipe-line", { opacity: 0, duration: 0.15 }, 5.55);
    tl.to("#p04-badge-before", { opacity: 0, duration: 0.2 }, 5.05);
    tl.fromTo("#p04-badge-after", { opacity: 0, y: -6 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, 5.15);

    // 6.0s: 하단 바꾼 이유 띠 등장
    tl.fromTo("#p04-reason", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 6.0);

    // 9.45~9.8s: 2차 전송 + 사용자 말풍선 2 등록

    tl.to("#p04-send", { scale: 1, backgroundColor: "#e5e2da", duration: 0.18, ease: "power2.out" }, 9.62);
